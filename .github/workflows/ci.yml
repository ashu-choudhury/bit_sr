name: CI & Bleeding-Edge Release

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-windows:
    name: Build & Test (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace --verbose

      - name: Build release binary
        run: cargo build --release --bin bit_sr

      - name: Package release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item target/release/bit_sr.exe -Destination staging/
          if (Test-Path README.md) { Copy-Item README.md -Destination staging/ }
          if (Test-Path LICENSE-APACHE) { Copy-Item LICENSE-APACHE -Destination staging/ }
          if (Test-Path LICENSE-MIT) { Copy-Item LICENSE-MIT -Destination staging/ }

          # Create release zip archive
          Compress-Archive -Path staging/* -DestinationPath bit_sr-windows-x86_64.zip -Force

          # Generate SHA256 checksum
          $hash = (Get-FileHash -Algorithm SHA256 bit_sr-windows-x86_64.zip).Hash
          "$hash  bit_sr-windows-x86_64.zip" | Out-File -Encoding utf8 bit_sr-windows-x86_64.zip.sha256

          # Create commit-pinned archive and checksum
          Copy-Item bit_sr-windows-x86_64.zip -Destination "bit_sr-windows-x86_64-${{ github.sha }}.zip"
          "$hash  bit_sr-windows-x86_64-${{ github.sha }}.zip" | Out-File -Encoding utf8 "bit_sr-windows-x86_64-${{ github.sha }}.zip.sha256"

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bit_sr-windows-x86_64
          path: |
            bit_sr-windows-x86_64.zip
            bit_sr-windows-x86_64.zip.sha256
            bit_sr-windows-x86_64-${{ github.sha }}.zip
            bit_sr-windows-x86_64-${{ github.sha }}.zip.sha256
          if-no-files-found: error

  build-android:
    name: Build & Package (Android APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Android Libraries and APK
        run: |
          chmod +x scripts/build_android.sh
          bash scripts/build_android.sh

      - name: Compute Checksums and Package
        run: |
          sha256sum target/bit_sr-debug.apk | awk '{print $1 "  bit_sr-debug.apk"}' > target/bit_sr-debug.apk.sha256
          cp target/bit_sr-debug.apk "target/bit_sr-debug-${{ github.sha }}.apk"
          sha256sum "target/bit_sr-debug-${{ github.sha }}.apk" | awk '{print $1 "  bit_sr-debug-${{ github.sha }}.apk"}' > "target/bit_sr-debug-${{ github.sha }}.apk.sha256"

      - name: Upload Android workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bit_sr-android
          path: |
            target/bit_sr-debug.apk
            target/bit_sr-debug.apk.sha256
            target/bit_sr-debug-${{ github.sha }}.apk
            target/bit_sr-debug-${{ github.sha }}.apk.sha256
          if-no-files-found: error

  publish-release:
    name: Publish Bleeding-Edge Multi-Platform Release
    needs: [build-and-test-windows, build-android]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: bit_sr-windows-x86_64
          path: release-dist/

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: bit_sr-android
          path: release-dist/

      - name: Update bleeding-edge git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f bleeding-edge ${{ github.sha }}
          git push -f origin bleeding-edge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish bleeding-edge release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bleeding-edge
          name: "Bleeding Edge (Windows & Android Build)"
          prerelease: true
          make_latest: false
          files: |
            release-dist/bit_sr-windows-x86_64.zip
            release-dist/bit_sr-windows-x86_64.zip.sha256
            release-dist/bit_sr-windows-x86_64-${{ github.sha }}.zip
            release-dist/bit_sr-windows-x86_64-${{ github.sha }}.zip.sha256
            release-dist/bit_sr-debug.apk
            release-dist/bit_sr-debug.apk.sha256
            release-dist/bit_sr-debug-${{ github.sha }}.apk
            release-dist/bit_sr-debug-${{ github.sha }}.apk.sha256
          body: |
            ## ⚠️ Bleeding-Edge Multi-Platform Development Build

            This is an automated continuous release built directly from the latest commit on `${{ github.ref_name }}`.

            ### Build Metadata
            - **Commit SHA**: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Branch / Ref**: `${{ github.ref_name }}`
            - **Triggered By**: `${{ github.actor }}`
            - **Workflow Run**: [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Download Artifacts
            #### 🖥️ Windows (x86_64)
            - **`bit_sr-windows-x86_64.zip`**: Latest standalone portable package for Windows
            - **`bit_sr-windows-x86_64.zip.sha256`**: SHA256 verification hash
            - **`bit_sr-windows-x86_64-${{ github.sha }}.zip`**: Commit-pinned release archive

            #### 📱 Android (ARM64 & x86_64)
            - **`bit_sr-debug.apk`**: Standalone installable Android accessibility service package
            - **`bit_sr-debug.apk.sha256`**: SHA256 verification hash
            - **`bit_sr-debug-${{ github.sha }}.apk`**: Commit-pinned APK package

            > **Warning**: Bleeding-edge builds reflect active development and may be incomplete or experimental.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
