[package]
name = "bit_sr_ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Accessible native Slint GUI, left-side screen reader menu, and settings dashboard for bit_sr"

[dependencies]
bit_sr_core = { path = "../bit_sr_core" }
slint = { version = "1.18", default-features = true }
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
log = "0.4"

[build-dependencies]
slint-build = "1.18"

